# One ordered protocol for the current page and paper. Captures are cached only
# when their compiled generator identity and every parameter match this recipe.
schema_version = 1
captures = "out/publication/captures"
camera_study = "docs/evidence/camera_counts"
room_qualification = "docs/evidence/room_qualification"

[capture]
seed = 0
audit_rooms = 512
rendered_rooms = 32
cameras = 4
width = 640
height = 400
playback_steps = 2
density = 0.65
human_density = 0.25
gi_rays = 1024
ssaa_factor = 0

[paper]
source = "tex/bevy_zeroverse.tex"

# Preserve both captured cohorts and their original source provenance.
# The lens pin also binds the installed gallery and papers byte for byte.
# This exception expires when either the release version or source hash changes.
[retained_evidence]
release_version = "0.56.2"
release_source_sha256 = "5c2f196770e1e46d6ca00957d0611369b71cdcd274593ff09a20bf6a07ce08e1"
capture_evidence_sha256 = "63564616f23c73482abb3c96a76af96db1b6f2e63c22b9d875a0faeace031e6d"
lens_evidence_sha256 = "88e7f00dfdea5f4010ae2b8ea83039275825bb2161af09aab7912f0ac569eba5"
reason = "Retain the published architecture and fisheye cohorts, galleries and papers with their original provenance. This patch avoids redundant native angular-view submission and velocity preparation, sets square browser capture defaults, and strengthens lens-format and platform-safe rejection checks. Local matched performance and correctness evidence is not relabeled as published gallery evidence."
