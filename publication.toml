# One ordered protocol for the current page and paper. Captures are cached only
# when their compiled generator identity and every parameter match this recipe.
schema_version = 1
captures = "out/publication/captures"

[capture]
seed = 0
audit_rooms = 512
rendered_rooms = 32
cameras = 4
width = 640
height = 400
playback_steps = 2
density = 0.65
human_density = 0.25
gi_rays = 1024

[paper]
source = "tex/bevy_zeroverse.tex"

# Frozen reference studies are validated/hashed as inputs, never relabelled as
# measurements of the current renderer. Refreshing these requires a new study.
[[references]]
id = "camera-baseline-and-motion"
generator_version = 21
gallery = "www/project/static/media/gallery.json"
page = "www/project/reference.html"

[[references]]
id = "matched-camera-baseline"
generator_version = 21
gallery = "www/project/static/media/baseline/gallery.json"
page = "www/project/reference.html"
