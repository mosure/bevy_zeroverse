# One ordered protocol for the current page and paper. Captures are cached only
# when their compiled generator identity and every parameter match this recipe.
schema_version = 1
captures = "out/publication/captures"
camera_study = "docs/evidence/camera_counts"
room_qualification = "docs/evidence/room_qualification"

[capture]
seed = 0
audit_rooms = 512
rendered_rooms = 32
cameras = 4
width = 640
height = 400
playback_steps = 2
density = 0.65
human_density = 0.25
gi_rays = 1024
ssaa_factor = 0

[paper]
source = "tex/bevy_zeroverse.tex"

# Bounded current-only measurement populations. Shadows, GI, SSAA and all
# annotation contracts remain enabled. These studies are independent of private
# matched before/after experiments.
[automation]
camera_audit_rooms = 64
camera_render_rooms = 2
preparation_rooms = 32
timing_rooms = 8
cpu_workers = 2
