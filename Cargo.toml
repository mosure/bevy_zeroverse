[package]
name = "bevy_zeroverse"
description = "bevy zeroverse synthetic dataset generator"
version = "0.28.2"
edition = "2021"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT"
keywords = [
  "bevy",
  "zeroverse",
  "machine-learning",
  "synthetic-data",
]
categories = [
  "computer-vision",
  "graphics",
  "rendering",
]
homepage = "https://github.com/mosure/bevy_zeroverse"
repository = "https://github.com/mosure/bevy_zeroverse"
readme = "README.md"
exclude = [
  ".cargo",
  ".devcontainer",
  ".github",
  "docs",
  "tex",
  "www",
  "dist",
  "build",
  "assets",
  "credits",
  "third_party",
  "out",
]
default-run = "viewer"


[workspace]
exclude = ["third_party/wgpu-hal", "third_party/wgpu-core"]
members = [
  ".",
  "crates/ffi",
  "crates/burn",
  "crates/burn_siglip2",
  "crates/capture",
  "crates/publication",
]


[features]
default = [
  "multi_threaded",
  "viewer",
]

multi_threaded = [
  "bevy/multi_threaded",
]

development = ["bevy/dynamic_linking"]

# Models are initialized only when human_motion JSON requests trajectories.
human_motion = ["dep:burn", "dep:burn_ardy", "dep:burn_llama", "dep:burn_human_inference", "dep:wasm-bindgen-futures"]
# Offline capture auditing only; no model initialization in scene generation.
embedding_audit = ["dep:burn", "dep:burn_siglip2", "dep:sha2"]

extension-module = ["pyo3/extension-module"]

perftest = []
plucker = []
python = ["extension-module", "pyo3", "webgpu"]

viewer = [
  "bevy_egui",
  "bevy-inspector-egui",
  "bevy_panorbit_camera",
  "bevy/bevy_ui",
  # The inspector relies on registered engine types; egui's picking integration
  # requires PickingPlugin in DefaultPlugins on both native and Wasm builds.
  "bevy/reflect_auto_register",
  "bevy/bevy_picking",
]

web = [
  "viewer",
  "webgpu",
]

webgl2 = ["bevy/webgl2"]
webgpu = [
  "bevy/webgpu",
]


[dependencies]
bevy_zeroverse_capture = { version = "0.1.0", path = "crates/capture" }
bevy_args = "4.0.0"
bevy_egui = { version = "0.40", optional = true }
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy_panorbit_camera = { version = "0.35.1", optional = true, features = ["bevy_egui"] }
bevy_mesh = "0.19.1"
clap = { version = "4.5", features = ["derive"] }
futures-intrusive = "0.5"
glob = "0.3"
itertools = "0.14"
noise = { version = "0.9" }
once_cell = "1.19"
pollster = "0.4"
pyo3 = { version = "0.27.2", features = ["macros"], optional = true }
rand = "0.9"
# Keep the procedural ChaCha stream independent; Bevy shape sampling uses rand 0.10.
rand_bevy = { package = "rand", version = "0.10" }
rand_chacha = "0.9"
rayon = { version = "1.11", optional = true }
serde = "1.0"
serde_json = "1.0"
strum = "0.27"
strum_macros = "0.27"
wgpu = { version = "29.0.4", features = ["counters"] }
anyhow = "1.0"
bytemuck = "1.19"
image = "0.25"
half = "2"
futures-lite = "2.3"
# Keep motion numerics tied to the capture identity, including downstream builds.
bevy_burn_human = { version = "=0.6.1", default-features = false }
burn_human = { version = "=0.5.1" }
burn_human_motion = { version = "=0.1.1" }
burn_ardy = { version = "=0.1.4", default-features = false, features = ["wgpu", "transport"], optional = true }
burn_llama = { version = "=0.1.2", features = ["wgpu"], optional = true }
burn_human_inference = { version = "=0.1.4", features = ["wgpu", "transport"], optional = true }
burn = { version = "0.21", default-features = false, features = ["std", "wgpu"], optional = true }
burn_siglip2 = { version = "0.1.1", path = "crates/burn_siglip2", default-features = false, features = ["wgpu", "preprocess", "bootstrap"], optional = true }
sha2 = { version = "0.10", optional = true }

# Local optimizations still reduce command-cache retention and Vulkan CPU upload
# latency; see docs/wgpu_dependency_review.md for the registry comparison.
# Cargo packaging excludes these sources and removes these root-only overrides.
[patch.crates-io]
wgpu-core = { path = "third_party/wgpu-core" }
wgpu-hal = { path = "third_party/wgpu-hal" }


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }


[dependencies.bevy]
version = "=0.19.1"
default-features = false
features = [
  "bevy_asset",
  "bevy_anti_alias",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_gizmos",
  "bevy_gizmos_render",
  "bevy_gltf",
  "bevy_image",
  "bevy_log",
  "bevy_light",
  "bevy_mesh",
  "bevy_pbr",
  "bevy_render",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_window",
  "bevy_winit",
  "jpeg",
  "png",
  "std",
  "tonemapping_luts",
  "webgpu",
  "x11",
  "zstd_rust",
]


[dependencies.web-sys]
version = "0.3"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Location',
  'Node',
  'UrlSearchParams',
  'Window',
]


[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
futures-intrusive = { version = "0.5.0" }
pollster = { version = "0.4" }
tempfile = "3.10"

[build-dependencies]
bevy_zeroverse_capture = { version = "0.1.0", path = "crates/capture", features = ["provenance"] }
serde_json = "1.0"
toml = "0.9"

[profile.dev.package."*"]
opt-level = 3

# Procedural texture/geometry loops live in this crate, not only dependencies.
[profile.dev]
opt-level = 3
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1


[lib]
path = "src/lib.rs"

[[bin]]
name = "viewer"
path = "src/viewer.rs"

[[bin]]
name = "ovoxel_autoencode"
path = "src/bin/ovoxel_autoencode.rs"

[[bench]]
name = "ovoxel"
harness = false

[[bin]]
name = "motion_validate"
path = "src/bin/motion_validate.rs"
required-features = ["human_motion"]

[[bin]]
name = "indoor_embed"
path = "src/bin/indoor_embed.rs"
required-features = ["embedding_audit"]
