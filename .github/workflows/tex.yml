name: 'build LaTeX document'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Install paper typesetter
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra poppler-utils
      - name: Rebuild verified publication from the current capture bundle
        run: cargo run --locked -p bevy_zeroverse_publication -- rebuild

      - name: upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: bevy_zeroverse
          path: www/project/static/papers/bevy_zeroverse.pdf
