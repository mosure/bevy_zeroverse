name: clippy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  clippy:
    name: clippy (${{ matrix.os }}, nightly)

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15]
        rust-toolchain:
          - nightly-2026-08-31

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v3

    # Workspace linting compiles the Python extension. PyO3 0.27 supports CPython through 3.14.
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: '3.14'

    - name: Setup ${{ matrix.rust-toolchain }} rust toolchain with caching
      uses: brndnmtthws/rust-action@v1
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: rustfmt, clippy
        cargo-packages: ""
        enable-sccache: "false"

    - name: lint
      env:
        PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      run: cargo clippy --all -- -Dwarnings
