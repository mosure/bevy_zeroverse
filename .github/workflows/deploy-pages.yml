name: deploy github pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A newer revision supersedes old rendering jobs. Check main again immediately
# before promoting the verified artifact to production.
concurrency:
  group: current-project-publication
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Only publish the current main revision
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'This revision is not current main; no site deployment.'
          fi

  publication:
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: 2
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: publication-native
      - name: Install headless Vulkan and paper tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1 libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev latexmk texlive-latex-extra poppler-utils ripgrep
          ICD="$(rg --files /usr/share/vulkan/icd.d -g 'lvp_icd*.json' | head -1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          RUNTIME="$(mktemp -d)"
          echo "XDG_RUNTIME_DIR=$RUNTIME" >> "$GITHUB_ENV"
      - name: Record the software rendering adapter
        run: vulkaninfo --summary
      - name: Resolve the source-bound Rust work plan
        id: plan
        run: |
          cargo run --locked -p bevy_zeroverse_publication -- plan > publication-plan.json
          echo "key=$(jq -r .cache_key publication-plan.json)" >> "$GITHUB_OUTPUT"
      # Only a fully verified bundle is cached. Partial render stages are never
      # deployed, and a cache hit is still checked against the live source.
      - uses: actions/cache@v4
        with:
          key: publication-v1-${{ runner.os }}-${{ steps.plan.outputs.key }}
          path: |
            www/project
            tex
            docs/evidence/camera_counts
            docs/evidence/room_qualification
            docs/evidence/fisheye
            docs/evidence/publication_run.json
      - name: Generate current renders, measurements, project page and paper
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          ARGS=()
          if [[ "$RELEASE_TAG" == v* ]]; then ARGS+=(--release-version "$RELEASE_TAG"); fi
          cargo run --locked -p bevy_zeroverse_publication -- sync "${ARGS[@]}"
          cargo run --locked -p bevy_zeroverse_publication -- verify-current "${ARGS[@]}"
          git diff --exit-code
      - name: Upload the exact verified publication
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            www/project
            tex
            docs/evidence/camera_counts
            docs/evidence/room_qualification
            docs/evidence/fisheye
            docs/evidence/publication_run.json
            publication-plan.json
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publication-failure-${{ github.sha }}
          retention-days: 7
          path: |
            publication-plan.json
            out/publication/**/*.json
            out/publication/**/*.log

  viewer:
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the motion-enabled WebGPU viewer from the same revision
        run: |
          cargo build --locked --target wasm32-unknown-unknown --bin bevy_zeroverse --profile wasm-release --no-default-features --features "web,human_motion"
          wasm-bindgen --out-name viewer --out-dir ./www/out/ --target web --remove-name-section --remove-producers-section ./target/wasm32-unknown-unknown/wasm-release/bevy_zeroverse.wasm
          test "$(wc -c < www/out/viewer_bg.wasm)" -lt 104857600
          mkdir -p www/assets
          rsync -a --exclude='/embedded/' assets/ www/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            www/out
            www/assets

  package-site:
    needs: [publication, viewer]
    runs-on: ubuntu-latest
    outputs:
      receipt: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer-${{ github.sha }}
          path: www
      # Overlay the verified publication last; never restore the viewer job's
      # checked-in, potentially old gallery over newly generated evidence.
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ github.sha }}
          path: .
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
      - uses: Swatinem/rust-cache@v2
      - name: Independently verify all publication bytes without a renderer
        run: |
          git diff --exit-code
          cargo run --locked -p bevy_zeroverse_publication -- verify-current
      - name: Open the packaged kiosk in Chrome and verify a presented room
        timeout-minutes: 6
        run: |
          node --test tests/browser_fullscreen.mjs
          python3 -m venv "$RUNNER_TEMP/kiosk-smoke"
          "$RUNNER_TEMP/kiosk-smoke/bin/pip" install playwright==1.65.2
          "$RUNNER_TEMP/kiosk-smoke/bin/python" scripts/smoke_kiosk_browser.py --site www --seed 70 --resolution 320
      - name: Record the source and fingerprints of the public entry points
        id: receipt
        run: |
          digest=$(bash scripts/pages_release.sh record www "$GITHUB_SHA")
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Package the verified website for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    needs: package-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$GITHUB_SHA" = "$current"
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live viewer, gallery and papers
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          RECEIPT: ${{ needs.package-site.outputs.receipt }}
        run: bash scripts/pages_release.sh verify "$SITE_URL" "$RECEIPT"
