name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install paper typesetter
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra poppler-utils
      - name: Rebuild and verify the current page and paper
        run: cargo run --locked -p bevy_zeroverse_publication -- rebuild
      - name: Stage the validated publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: publication-bundle
          path: |
            www/project
            tex

  deploy:
    runs-on: macos-latest
    needs: publication

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: Retrieve the validated publication bundle
        uses: actions/download-artifact@v4
        with:
          name: publication-bundle
          path: .

      - name: setup nightly rust toolchain with caching
        uses: brndnmtthws/rust-action@v1
        with:
          toolchain: nightly
          components: rustfmt, clippy
          enable-sccache: "false"

      - name: install wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      - name: Verify the exact page and paper selected for deployment
        run: cargo run --locked -p bevy_zeroverse_publication -- verify

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: build wasm artifacts
        run: cargo build --locked --target wasm32-unknown-unknown --bin viewer --profile wasm-release --no-default-features --features "web,human_motion"

      - name: generate bindings with wasm-bindgen
        run: wasm-bindgen --out-dir ./www/out/ --target web --remove-name-section --remove-producers-section ./target/wasm32-unknown-unknown/wasm-release/viewer.wasm

      - name: check GitHub Pages artifact size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wasm = Path("www/out/viewer_bg.wasm")
          size = wasm.stat().st_size
          print(f"Motion-enabled viewer: {size / 1024**2:.2f} MiB")
          assert size < 100 * 1024**2, "Wasm exceeds GitHub's per-file limit"
          PY

      - name: copy assets
        run: mkdir -p ./www/assets && cp -r ./assets/* ./www/assets/

      - name: deploy to github pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./www
          branch: www
