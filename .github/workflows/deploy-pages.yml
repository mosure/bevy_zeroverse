name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: setup nightly rust toolchain with caching
        uses: brndnmtthws/rust-action@v1
        with:
          toolchain: nightly
          components: rustfmt, clippy
          enable-sccache: "false"

      - name: install wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: build wasm artifacts
        run: cargo build --locked --target wasm32-unknown-unknown --bin viewer --release --no-default-features --features "web,human_motion"

      - name: generate bindings with wasm-bindgen
        run: wasm-bindgen --out-dir ./www/out/ --target web --remove-name-section --remove-producers-section ./target/wasm32-unknown-unknown/release/viewer.wasm

      - name: check GitHub Pages artifact size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wasm = Path("www/out/viewer_bg.wasm")
          size = wasm.stat().st_size
          print(f"Motion-enabled viewer: {size / 1024**2:.2f} MiB")
          assert size < 100 * 1024**2, "Wasm exceeds GitHub's per-file limit"
          PY

      - name: copy assets
        run: mkdir -p ./www/assets && cp -r ./assets/* ./www/assets/

      - name: deploy to github pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./www
          branch: www
