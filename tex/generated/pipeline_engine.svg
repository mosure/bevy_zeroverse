<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1560" height="780" viewBox="0 0 1560 780"><rect width="100%" height="100%" fill="#f7f8f3"/><g font-family="DejaVu Sans" fill="#20382e"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#71828a"/></marker></defs><text x="32.000" y="42.000" font-size="29">Seeded programs → immutable preparation → readiness → calibrated views</text><text x="32.000" y="76.000" font-size="18">Shared bounded CPU pool · stable assembly order · GPU material and lighting caches · no quality reduction</text><rect x="32" y="108" width="460" height="100" rx="10" fill="#e5ecec" stroke="#bac7cc"/><text x="50.000" y="144.000" font-size="22">Layout + appearance + cameras</text><text x="50.000" y="177.000" font-size="17">Architecture, placements, lights, paths, validation</text><rect x="552" y="108" width="455" height="100" rx="10" fill="#dbece5" stroke="#bac7cc"/><text x="570.000" y="144.000" font-size="22">Parallel geometry builders</text><text x="570.000" y="177.000" font-size="17">Architecture | objects | AnnyBody + clothing</text><rect x="1067" y="108" width="455" height="100" rx="10" fill="#e5ecec" stroke="#bac7cc"/><text x="1085.000" y="144.000" font-size="22">Consumed material selection</text><text x="1085.000" y="177.000" font-size="17">Only used finish programs; stable handles</text><path d="M492 158 L549 158" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1007 158 L1064 158" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="120" y="280" width="580" height="100" rx="10" fill="#f8e7d7" stroke="#bac7cc"/><text x="138.000" y="316.000" font-size="22">Material recipes + CPU fallback maps</text><text x="138.000" y="349.000" font-size="17">GPU recipes, transport albedo, normal/roughness mips</text><rect x="820" y="280" width="650" height="100" rx="10" fill="#e3e3f7" stroke="#bac7cc"/><text x="838.000" y="316.000" font-size="22">Transport → group plan → parallel meshes</text><text x="838.000" y="349.000" font-size="17">Shared triangles, BVH, mesh attributes and tangents</text><path d="M1295 211 L1140 277" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1090 210 L550 277" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="36.000" y="270.000" font-size="19">FORK</text><text x="36.000" y="417.000" font-size="19">JOIN</text><rect x="300" y="424" width="960" height="100" rx="10" fill="#dceaf4" stroke="#bac7cc"/><text x="318.000" y="460.000" font-size="22">Bind transport → HDR reflections → lighting requests → group binding</text><text x="318.000" y="493.000" font-size="17">One coherent room, with semantic/instance attachments retained</text><path d="M410 383 L600 421" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1145 383 L960 421" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="32" y="578" width="460" height="100" rx="10" fill="#e8e2f2" stroke="#bac7cc"/><text x="50.000" y="614.000" font-size="22">Install + upload + GPU bake</text><text x="50.000" y="647.000" font-size="17">Maps/mips, GI; optional motion inference</text><rect x="552" y="578" width="455" height="100" rx="10" fill="#e8e2f2" stroke="#bac7cc"/><text x="570.000" y="614.000" font-size="22">Explicit readiness gates</text><text x="570.000" y="647.000" font-size="17">Assets, pipelines, lighting, motion, settle</text><rect x="1067" y="578" width="455" height="100" rx="10" fill="#dbece5" stroke="#bac7cc"/><text x="1085.000" y="614.000" font-size="22">RGB + geometric raster → output</text><text x="1085.000" y="647.000" font-size="17">Shared identities; async readback / tensor</text><path d="M560 527 L260 575" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M492 628 L549 628" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1007 628 L1064 628" stroke="#71828a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="32.000" y="735.000" font-size="19">Native: next rooms prepare while current views render/read back. Browser: cooperative work on the event loop.</text></g></svg>
