[package]
name = "zeroverse_wgpu_probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "counters"] }
pollster = "0.4"
serde_json = "1"

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
