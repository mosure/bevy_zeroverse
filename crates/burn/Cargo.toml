[package]
name = "bevy_zeroverse_burn"
version = "0.46.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "bevy zeroverse synthetic dataset rust generator"
authors = ["mosure <mitchell@mosure.me>"]
keywords = [
  "bevy",
  "zeroverse",
  "machine-learning",
  "synthetic-data",
]
categories = [
  "computer-vision",
  "graphics",
  "rendering",
]
homepage = "https://github.com/mosure/bevy_zeroverse"
repository = "https://github.com/mosure/bevy_zeroverse"

[package.metadata.docs.rs]
features = ["gpu_tensor"]
targets = ["x86_64-unknown-linux-gnu"]


[[bin]]
name = "zeroverse_gen"
path = "src/bin/zeroverse_gen.rs"

[[bench]]
name = "chunk_gen"
harness = false

[dependencies]
anyhow = "1.0"
bincode = { version = "2.0", features = ["serde"] }
burn = { version = "=0.22.1", default-features = false, features = ["std", "dataset"] }
bevy = { version = "=0.20.0", default-features = false, optional = true }
cubecl = { version = "=0.11.3", default-features = false, features = ["std"], optional = true }
bevy_zeroverse_capture = { path = "../capture", version = "=0.6.17", features = ["provenance"] }
burn-cubecl = { version = "=0.22.1", default-features = false, features = ["std"], optional = true }
burn-fusion = { version = "=0.22.1", default-features = false, features = ["std"], optional = true }
clap = { version = "4.5", features = ["derive"] }
lz4_flex = { version = "0.12.2", default-features = false, features = ["frame"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.7"
zstd = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
bytemuck = "1.17"
rand = "0.9"
ratatui = "0.29"
crossterm = "0.29"
ndarray = { version = "0.16", default-features = false, features = ["std"] }
ndarray-npy = { version = "0.9", features = ["npz"] }

bevy_zeroverse = { path = "../..", version = "0.62.1", default-features = true }

# Native CUDA interoperability uses published APIs only. These dependencies and
# their features never enter the default or WebGPU/WASM dependency graph.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }
ash = { version = "0.38", default-features = false, optional = true }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "fallback-dynamic-loading", "cuda-version-from-build-system", "fallback-latest"], optional = true }
bevy-render-cuda = { package = "bevy_render", version = "=0.20.0", default-features = false, features = ["raw_vulkan_init"], optional = true }
burn-tensor-cuda = { package = "burn-tensor", version = "=0.22.1", default-features = false, features = ["std", "cuda"], optional = true }
cubecl-runtime = { version = "=0.11.3", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.13"

[features]
human_motion = ["bevy_zeroverse/human_motion"]

gpu_tensor = ["dep:cubecl", "dep:bevy", "dep:burn-cubecl", "burn/wgpu", "burn/cubecl"]
gpu_training_bench = ["gpu_tensor", "burn/optim"]
gpu_tensor_fusion = ["gpu_tensor", "dep:burn-fusion", "burn/fusion"]
cuda_ipc = ["cuda_interop", "dep:libc"]
cuda_interop = ["gpu_tensor", "dep:ash", "dep:cudarc", "dep:bevy-render-cuda", "dep:burn-tensor-cuda", "dep:cubecl-runtime"]

[[example]]
name = "gpu_jit_bench"
required-features = ["gpu_tensor"]

[[example]]
name = "material_jit_qualification"
required-features = ["gpu_training_bench"]

[[bin]]
name = "zeroverse_gpu_worker"
path = "src/bin/zeroverse_gpu_worker.rs"
required-features = ["cuda_ipc"]

[[example]]
name = "gpu_ipc_qualification"
required-features = ["cuda_ipc"]
